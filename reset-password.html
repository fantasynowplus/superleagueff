<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password - Super League</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --navy:#06192b; --lift:#0d2740; --rule:#1a4d6f; --orange:#e26f0f; --tan:#f1e6d1; --dim:#8fa3b5; --green:#16a34a; --red:#dc2626; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--navy); color:var(--tan); font-family:"Work Sans",system-ui,sans-serif; }
.card { width:100%; max-width:420px; background:var(--lift); border:1px solid var(--rule); border-radius:10px; padding:36px 30px; }
h1 { font-family:Anton,Impact,sans-serif; text-transform:uppercase; letter-spacing:0.5px; font-size:28px; margin:0 0 6px; color:#fff; }
p.sub { color:var(--dim); margin:0 0 26px; font-size:14px; }
label { display:block; font-size:13px; margin-bottom:6px; margin-top:14px; color:var(--tan); }
input { width:100%; padding:12px; background:var(--navy); border:1px solid var(--rule); border-radius:6px; color:var(--tan); font-size:15px; }
input:focus { outline:none; border-color:var(--orange); }
button { width:100%; margin-top:20px; padding:13px; border:none; border-radius:6px; background:var(--orange); color:var(--navy); font-family:"Work Sans",sans-serif; font-weight:600; font-size:15px; cursor:pointer; }
button:hover:not(:disabled){ background:#f0872f; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.msg { margin-top:18px; font-size:14px; line-height:1.5; }
.msg.ok { color:var(--green); }
.msg.bad { color:var(--red); }
.hint { font-size:12px; color:var(--dim); margin-top:4px; }
.back { display:block; margin-top:20px; text-align:center; color:var(--dim); font-size:13px; text-decoration:none; }
.back:hover { color:var(--orange); }
#form { display:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Set New Password</h1>
    <p class="sub" id="intro">Verifying your reset link...</p>

    <div id="form">
      <label for="pw">New Password</label>
      <input type="password" id="pw" placeholder="At least 6 characters" autocomplete="new-password">

      <label for="pw2">Confirm Password</label>
      <input type="password" id="pw2" placeholder="Re-enter password" autocomplete="new-password">

      <button id="saveBtn">Update Password</button>
    </div>

    <div class="msg" id="msg"></div>
    <a class="back" href="./admin.html">Back to login</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://fckobcxprmudfpxdmswi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZja29iY3hwcm11ZGZweGRtc3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MTI5MzcsImV4cCI6MjA5OTE4ODkzN30.9wMb0SXAZs-jo1G9xRxk5M47fJIIU7-DTJTl1yFRwFk';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: true, flowType: 'implicit' }
});

const intro = document.getElementById('intro');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('saveBtn');

let ready = false;

client.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || (session && !ready)) {
    ready = true;
    intro.textContent = 'Choose a new password for your account.';
    form.style.display = 'block';
  }
});

setTimeout(async () => {
  if (ready) return;
  const { data } = await client.auth.getSession();
  if (data.session) {
    ready = true;
    intro.textContent = 'Choose a new password for your account.';
    form.style.display = 'block';
  } else {
    intro.textContent = 'This reset link is invalid or has expired.';
    msg.className = 'msg bad';
    msg.textContent = 'Request a new link from the forgot-password page.';
  }
}, 1200);

btn.addEventListener('click', async () => {
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;

  if (pw.length < 6) {
    msg.className = 'msg bad';
    msg.textContent = 'Password must be at least 6 characters.';
    return;
  }
  if (pw !== pw2) {
    msg.className = 'msg bad';
    msg.textContent = 'Passwords do not match.';
    return;
  }

  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = 'Updating...';

  const { error } = await client.auth.updateUser({ password: pw });

  if (error) {
    btn.disabled = false;
    msg.className = 'msg bad';
    msg.textContent = 'Could not update password: ' + error.message;
    return;
  }

  form.style.display = 'none';
  msg.className = 'msg ok';
  msg.textContent = 'Password updated. Redirecting to login...';
  setTimeout(() => { window.location.href = './admin.html'; }, 2000);
});
</script>
</body>
</html>
