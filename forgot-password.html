<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Super League</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --navy:#06192b; --lift:#0d2740; --rule:#1a4d6f; --orange:#e26f0f; --tan:#f1e6d1; --dim:#8fa3b5; --green:#16a34a; --red:#dc2626; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--navy); color:var(--tan); font-family:"Work Sans",system-ui,sans-serif; }
.card { width:100%; max-width:420px; background:var(--lift); border:1px solid var(--rule); border-radius:10px; padding:36px 30px; }
h1 { font-family:Anton,Impact,sans-serif; text-transform:uppercase; letter-spacing:0.5px; font-size:28px; margin:0 0 6px; color:#fff; }
p.sub { color:var(--dim); margin:0 0 26px; font-size:14px; }
label { display:block; font-size:13px; margin-bottom:6px; color:var(--tan); }
input { width:100%; padding:12px; background:var(--navy); border:1px solid var(--rule); border-radius:6px; color:var(--tan); font-size:15px; }
input:focus { outline:none; border-color:var(--orange); }
button { width:100%; margin-top:18px; padding:13px; border:none; border-radius:6px; background:var(--orange); color:var(--navy); font-family:"Work Sans",sans-serif; font-weight:600; font-size:15px; cursor:pointer; }
button:hover:not(:disabled){ background:#f0872f; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.msg { margin-top:18px; font-size:14px; line-height:1.5; }
.msg.ok { color:var(--green); }
.msg.bad { color:var(--red); }
.back { display:block; margin-top:20px; text-align:center; color:var(--dim); font-size:13px; text-decoration:none; }
.back:hover { color:var(--orange); }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p class="sub">Enter your email and we'll send you a link to set a new password.</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <button id="sendBtn">Send Reset Link</button>
    <div class="msg" id="msg"></div>

    <a class="back" href="./login.html">Back to login</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://fckobcxprmudfpxdmswi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZja29iY3hwcm11ZGZweGRtc3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MTI5MzcsImV4cCI6MjA5OTE4ODkzN30.9wMb0SXAZs-jo1G9xRxk5M47fJIIU7-DTJTl1yFRwFk';
const RESET_REDIRECT = 'https://superleagueff.org/reset-password.html';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const btn = document.getElementById('sendBtn');
const msg = document.getElementById('msg');

btn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email || !email.includes('@')) {
    msg.className = 'msg bad';
    msg.textContent = 'Please enter a valid email address.';
    return;
  }

  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = 'Sending...';

  const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: RESET_REDIRECT });

  if (error) {
    btn.disabled = false;
    msg.className = 'msg bad';
    msg.textContent = 'Something went wrong. Please try again in a moment.';
    return;
  }

  msg.className = 'msg ok';
  msg.textContent = 'If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.';
});

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') btn.click();
});
</script>
</body>
</html>
